<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario de clase</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 4px solid black;
            padding: 10px;
        }
        th {
            background-color: #d3d3d3;
        }
        .awebt { background-color: #a2c4c9; }
        .segit { background-color: #b6d7a8; }
        .ingt { background-color: #f4cccc; }
        .sor { background-color: #fce5cd; }
        .opt { background-color: #d9d2e9; }
        .proy { background-color: #fff2cc; }
        .ipe2 { background-color: #ead1dc; }
        .sred { background-color: #c9daf8; }
        .recreo { background-color: #ffe599; font-weight: bold; letter-spacing: 3px; }
        .firma {
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Horario de 2º SMR</h1>

    <table>
        <tr>
            <th>Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
        </tr>
        <tr>
            <td>15:15 - 16:15</td>
            <td class="awebt" rowspan="2">AWEbt</td>
            <td class="segit" rowspan="2">SEGIt</td>
            <td class="ingt" rowspan="2">INGt</td>
            <td class="sor" rowspan="3">SOR</td>
            <td class="opt" rowspan="3">Opt</td>
        </tr>
        <tr>
            <td>16:15 - 17:15</td>
        </tr>
        <tr>
            <td>17:15 - 18:15</td>
            <td class="proy">Proy</td>
            <td class="ipe2">IPE2</td>
            <td class="ipe2">IPE2</td>
        </tr>
        <tr>
            <td>18:15 - 18:30</td>
            <td class="recreo" colspan="5">RECREO</td>
        </tr>
        <tr>
            <td>18:30 - 19:30</td>
            <td class="sor" rowspan="3">SOR</td>
            <td class="ipe2">IPE2</td>
            <td class="proy">Proy</td>
            <td class="sred">SRed</td>
            <td class="sred" rowspan="3">SRed</td>
        </tr>
        <tr>
            <td>19:30 - 20:30</td>
            <td class="sred" rowspan="2">SRed</td>
            <td class="awebt" rowspan="2">AWEbt</td>
            <td class="segit" rowspan="2">SEGIt</td>
        </tr>
        <tr>
            <td>20:30 - 21:30</td>
        </tr>
    </table>

    <div class="firma">
        <h2>Pablo Molina Cansino</h2>
        <img src="giphy.gift.gif" alt="Mi GIF favorito">
    </div>

</body>
</html>
